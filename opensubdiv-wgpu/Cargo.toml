[package]
name = "opensubdiv-wgpu"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["Philippe Llerena <philippe.llerena@forticheprod.com>"]
license = "MIT AND LicenseRef-TOST-1.0"
description = "wgpu compute kernels evaluating opensubdiv-rs stencil and patch tables on the GPU (the role of OpenSubdiv's Osd evaluators)"
repository = "https://github.com/doubleailes/OpenSubdiv-rs"
documentation = "https://docs.rs/opensubdiv-wgpu"
readme = "README.md"
keywords = ["subdivision", "wgpu", "gpu", "catmull-clark", "loop"]
categories = ["graphics", "rendering"]

# Not published until opensubdiv-rs releases the `osd` API (0.6): a version
# requirement on the released 0.5 would resolve to a crate without it.
# Publishing means requiring that release here and removing this line.
publish = false

[dependencies]
opensubdiv-rs = { path = ".." }
wgpu = "30"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
