[package]
name = "opensubdiv-wgpu"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["Philippe Llerena <philippe.llerena@forticheprod.com>"]
license = "MIT"
description = "wgpu compute kernels evaluating opensubdiv-rs stencil and patch tables on the GPU (the role of OpenSubdiv's Osd evaluators)"
repository = "https://github.com/doubleailes/OpenSubdiv-rs"
documentation = "https://docs.rs/opensubdiv-wgpu"
readme = "README.md"
keywords = ["subdivision", "wgpu", "gpu", "catmull-clark", "loop"]
categories = ["graphics", "rendering"]

[dependencies]
opensubdiv-rs = { path = "..", version = "0.5" }
wgpu = "30"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
